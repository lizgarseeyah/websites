<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LG</title>
<meta name="description" content="A quiet front door.">
<meta name="robots" content="noindex">
<meta property="og:title" content="LG">
<meta property="og:description" content="A quiet front door.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230b0b0f'/%3E%3Ctext x='12' y='17' font-family='Georgia,serif' font-size='13' fill='%23e8e3d6' text-anchor='middle'%3ELG%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0b0b0f; --ink:#ece7da; --muted:#6c6a63; --line:rgba(236,231,218,.12);
    --accent:#c9a24b;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Iowan Old Style",Georgia,"Times New Roman",serif;
    display:grid; place-items:center; min-height:100svh; overflow:hidden;
  }
  .skip-link{position:absolute;left:-9999px;top:0}
  .skip-link:focus{left:8px;top:8px;background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:8px;z-index:10}

  main{text-align:center; padding:32px; position:relative}
  .mark{
    font-size:clamp(56px,16vw,148px); line-height:.9; letter-spacing:.02em;
    margin:0; font-weight:400;
    background:linear-gradient(180deg,var(--ink),#b9b3a3);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .rule{width:46px;height:1px;background:var(--accent);margin:26px auto 0;opacity:.8}
  .sub{
    margin:22px 0 0; font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:12px; letter-spacing:.32em; text-transform:uppercase; color:var(--muted);
  }
  /* ambient: a single slow breath of light, disabled under reduced motion */
  .halo{
    position:fixed; inset:0; pointer-events:none; z-index:-1;
    background:radial-gradient(60% 50% at 50% 46%, rgba(201,162,75,.10), transparent 70%);
    animation:breathe 9s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}
  @media (prefers-reduced-motion: reduce){ .halo{animation:none; opacity:.7} }
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="halo" aria-hidden="true"></div>
<main id="main">
  <h1 class="mark">LG</h1>
  <div class="rule" aria-hidden="true"></div>
  <p class="sub">there is a door</p>
</main>

<script src="shared/door-lock.js" data-site="home" defer></script>
</body>
</html>
